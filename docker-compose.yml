services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SANITY_PROJECT_ID: ${NEXT_PUBLIC_SANITY_PROJECT_ID:-}
        NEXT_PUBLIC_SANITY_DATASET: ${NEXT_PUBLIC_SANITY_DATASET:-}
        NEXT_PUBLIC_SANITY_API_VERSION: ${NEXT_PUBLIC_SANITY_API_VERSION:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
    # Local dev builds to this tag; CI overrides WEB_IMAGE with the ghcr ref so
    # `compose pull` fetches a prebuilt image instead of compiling on the host.
    image: ${WEB_IMAGE:-portfolio-web:local}
    env_file:
      - path: .env
        required: false
    environment:
      - NEXT_PUBLIC_SANITY_PROJECT_ID=${NEXT_PUBLIC_SANITY_PROJECT_ID:-}
      - NEXT_PUBLIC_SANITY_DATASET=${NEXT_PUBLIC_SANITY_DATASET:-}
      - NEXT_PUBLIC_SANITY_API_VERSION=${NEXT_PUBLIC_SANITY_API_VERSION:-}
      - SANITY_API_TOKEN=${SANITY_API_TOKEN:-}
      - NEXT_PUBLIC_UMAMI_WEBSITE_ID=${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:3000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    depends_on:
      web:
        condition: service_healthy
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped

  umami:
    image: docker.umami.is/umami-software/umami:latest
    depends_on:
      umami-db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://umami:${UMAMI_DB_PASSWORD:-umami}@umami-db:5432/umami
      - APP_SECRET=${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET in .env (any random string)}
      - CLIENT_IP_HEADER=cf-connecting-ip
    restart: unless-stopped
    ports:
      # Loopback-only, like `web`. Not exposed through the tunnel — reach the
      # admin dashboard from the host (or via SSH tunnel on the deploy server).
      - "127.0.0.1:${UMAMI_HOST_PORT:-3001}:3000"

  umami-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${UMAMI_DB_PASSWORD:-umami}
      - POSTGRES_DB=umami
      # UTC avoids offset weirdness in Umami's time-bucketed reports.
      - TZ=UTC
      - PGTZ=UTC
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  umami-db-data:
