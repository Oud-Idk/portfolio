services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SANITY_PROJECT_ID: ${NEXT_PUBLIC_SANITY_PROJECT_ID:-}
        NEXT_PUBLIC_SANITY_DATASET: ${NEXT_PUBLIC_SANITY_DATASET:-}
        NEXT_PUBLIC_SANITY_API_VERSION: ${NEXT_PUBLIC_SANITY_API_VERSION:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    # Local dev builds to this tag; CI overrides WEB_IMAGE with the ghcr ref so
    # `compose pull` fetches a prebuilt image instead of compiling on the host.
    image: ${WEB_IMAGE:-portfolio-web:local}
    env_file:
      - path: .env.local
        required: false
    environment:
      - NEXT_PUBLIC_SANITY_PROJECT_ID=${NEXT_PUBLIC_SANITY_PROJECT_ID:-}
      - NEXT_PUBLIC_SANITY_DATASET=${NEXT_PUBLIC_SANITY_DATASET:-}
      - NEXT_PUBLIC_SANITY_API_VERSION=${NEXT_PUBLIC_SANITY_API_VERSION:-}
      - SANITY_API_TOKEN=${SANITY_API_TOKEN:-}
    restart: unless-stopped
    ports:
      # HOST:CONTAINER. The container always listens on 3000 internally; only the
      # host side moves, so the published port can differ per machine.
      # Loopback-only: the tunnel is the intended way in.
      # The deploy server already has 8080 bound by another stack, hence 8090.
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:3000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    depends_on:
      web:
        condition: service_healthy
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
