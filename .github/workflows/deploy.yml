name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time; don't cancel a run that's already rolling out.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        # NEXT_PUBLIC_* are inlined at build time, so the build needs them.
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          NEXT_PUBLIC_SANITY_API_VERSION: ${{ secrets.NEXT_PUBLIC_SANITY_API_VERSION }}
        run: npm run build

  deploy:
    name: Deploy to server
    # The image is built on the runner host, so `ci` acts as the gate.
    needs: ci
    # `production` avoids the default self-hosted Linux pool, which is shared
    # with other jobs on this machine.
    runs-on: [self-hosted, Linux, X64, production]
    steps:
      - uses: actions/checkout@v4

      - name: Write .env
        # Secrets are materialized here, on the deploy host, and never leave it.
        # Existing values (tunnel token, host port) are preserved across runs.
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          NEXT_PUBLIC_SANITY_API_VERSION: ${{ secrets.NEXT_PUBLIC_SANITY_API_VERSION }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          set -euo pipefail
          touch .env
          chmod 600 .env
          set_env() {
            # Replace the key if present, otherwise append it.
            if grep -qE "^$1=" .env; then
              # Use a temp file so the value never lands in shell history/logs.
              KEY="$1" VAL="$2" python3 - <<'PY'
          import os, pathlib
          key, val = os.environ["KEY"], os.environ["VAL"]
          p = pathlib.Path(".env")
          lines = [f"{key}={val}" if l.startswith(key + "=") else l
                   for l in p.read_text().splitlines() if l.strip()]
          p.write_text("\n".join(lines) + "\n")
          PY
            else
              printf '%s=%s\n' "$1" "$2" >> .env
            fi
          }
          set_env SANITY_API_TOKEN "$SANITY_API_TOKEN"
          set_env NEXT_PUBLIC_SANITY_PROJECT_ID "$NEXT_PUBLIC_SANITY_PROJECT_ID"
          set_env NEXT_PUBLIC_SANITY_DATASET "$NEXT_PUBLIC_SANITY_DATASET"
          set_env NEXT_PUBLIC_SANITY_API_VERSION "$NEXT_PUBLIC_SANITY_API_VERSION"
          set_env CLOUDFLARE_TUNNEL_TOKEN "$CLOUDFLARE_TUNNEL_TOKEN"
          # This host already binds 8080 for another stack, so publish on 8090.
          set_env WEB_HOST_PORT 8090
          set_env NEXT_PUBLIC_SITE_URL "${SITE_URL:-https://oud-idk.dev}"
          echo "wrote .env with $(grep -cE '^[A-Z_]+=' .env) keys"

      - name: Build and restart
        run: |
          set -euo pipefail
          docker compose --env-file .env up -d --build
          # Wait for the app's own healthcheck to pass.
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' \
              "$(docker compose --env-file .env ps -q web)" 2>/dev/null || echo none)
            if [ "$status" = "healthy" ]; then
              echo "web is healthy after ${i}0s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::web never became healthy"
              docker compose --env-file .env logs --tail 50 web
              exit 1
            fi
            sleep 10
          done
          docker image prune -f > /dev/null
          echo "--- running services ---"
          docker compose --env-file .env ps

      - name: Verify the tunnel serves the site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://oud-idk.dev' }}
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$SITE_URL/" || true)
            if [ "$code" = "200" ]; then
              echo "Deployed: $SITE_URL (200)"
              exit 0
            fi
            echo "Attempt $i: got '$code', retrying..."
            sleep 10
          done
          echo "::error::$SITE_URL did not return 200"
          docker compose --env-file .env logs --tail 30 cloudflared
          exit 1
