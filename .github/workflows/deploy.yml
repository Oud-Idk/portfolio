name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time; don't cancel a run that's already rolling out.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: name
        name: Resolve image reference
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=${REGISTRY}/${repo}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "prod=${REGISTRY}/${repo}:prod" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}
            ${{ steps.name.outputs.prod }}
          build-args: |
            NEXT_PUBLIC_SANITY_PROJECT_ID=${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
            NEXT_PUBLIC_SANITY_DATASET=${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
            NEXT_PUBLIC_SANITY_API_VERSION=${{ vars.NEXT_PUBLIC_SANITY_API_VERSION }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build
    runs-on: [self-hosted, Linux, X64, production]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy Containers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          WEB_IMAGE: ${{ needs.build.outputs.image }} # Docker Compose reads this for image
        run: |
          set -e
          cd /opt/portfolio

          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          git pull --ff-only origin main
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f

          docker logout ghcr.io

      - name: Verify the tunnel serves the site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://oud-idk.dev' }}
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$SITE_URL/" || true)
            if [ "$code" = "200" ]; then
              echo "Deployed: $SITE_URL (200)"
              exit 0
            fi
            echo "Attempt $i: got '$code', retrying..."
            sleep 10
          done
          echo "::error::$SITE_URL did not return 200"
          docker compose logs --tail 30 cloudflared
          exit 1
