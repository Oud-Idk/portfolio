name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time; don't cancel a run that's already rolling out.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit
      # No `npm run build` here: the image build below is the real build and
      # fails just as loudly, so building twice would only cost time.

  build:
    name: Build & push image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # GHCR requires a lowercase path, and the repo owner is mixed case.
      - id: name
        name: Resolve image reference
        # Pinned because the lowercasing below is a bash-ism.
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=${REGISTRY}/${repo}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "prod=${REGISTRY}/${repo}:prod" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # `:prod` is the moving tag for manual runs; the sha tag is what the
          # deploy job pins to, so a rollback is just a re-run of an old sha.
          tags: |
            ${{ steps.name.outputs.image }}
            ${{ steps.name.outputs.prod }}
          # NEXT_PUBLIC_* are inlined into the client bundle at build time, so
          # they must be passed in. They are public by definition — anyone can
          # read them from the shipped JS — so they live in repo `vars`, not
          # `secrets`. The `vars` context is available in step `with:`.
          build-args: |
            NEXT_PUBLIC_SANITY_PROJECT_ID=${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
            NEXT_PUBLIC_SANITY_DATASET=${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
            NEXT_PUBLIC_SANITY_API_VERSION=${{ vars.NEXT_PUBLIC_SANITY_API_VERSION }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    # The image is built in CI and only pulled here, so `build` gates the rollout.
    needs: [ci, build]
    # `production` avoids the default self-hosted Linux pool, which is shared
    # with other jobs on this machine.
    runs-on: [self-hosted, Linux, X64, production]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore .env on the deploy host
        # `actions/checkout` runs `git clean -ffdx`, which deletes any .env in
        # the work tree -- including one placed there by hand. The real file
        # therefore lives outside the checkout and is copied in per run.
        #
        # It holds only the runtime secrets: SANITY_API_TOKEN,
        # CLOUDFLARE_TUNNEL_TOKEN, WEB_HOST_PORT. The NEXT_PUBLIC_* values are
        # baked into the image at build time and are not needed here.
        #
        # This host already binds 8080 for another stack, so the file must set
        # WEB_HOST_PORT=8090 or the publish will collide.
        run: |
          set -euo pipefail
          src="$HOME/.portfolio.env"
          if [ ! -s "$src" ]; then
            echo "::error::$src is missing or empty; copy it there once, mode 600 (see .env.docker.example)"
            exit 1
          fi
          for key in SANITY_API_TOKEN CLOUDFLARE_TUNNEL_TOKEN WEB_HOST_PORT; do
            if ! grep -qE "^${key}=.+" "$src"; then
              echo "::error::$src is missing a non-empty $key"
              exit 1
            fi
          done
          install -m 600 "$src" .env
          # Names only — values are never printed.
          echo "keys present: $(grep -oE '^[A-Z0-9_]+' .env | tr '\n' ' ')"

      - name: Pull and restart
        env:
          WEB_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          docker compose pull
          # --no-build is the point of the split: never compile on the host, so
          # a rebuild can't silently produce something other than CI's image.
          docker compose up -d --no-build
          # Wait for the app's own healthcheck to pass.
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' \
              "$(docker compose ps -q web)" 2>/dev/null || echo none)
            if [ "$status" = "healthy" ]; then
              echo "web is healthy after ${i}0s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::web never became healthy"
              docker compose logs --tail 50 web
              exit 1
            fi
            sleep 10
          done
          # `until` keeps anything a container is still using, so only superseded
          # image layers from earlier deploys go.
          docker image prune -f --filter until=168h > /dev/null
          echo "--- running services ---"
          docker compose ps

      - name: Verify the tunnel serves the site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://oud-idk.dev' }}
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$SITE_URL/" || true)
            if [ "$code" = "200" ]; then
              echo "Deployed: $SITE_URL (200)"
              exit 0
            fi
            echo "Attempt $i: got '$code', retrying..."
            sleep 10
          done
          echo "::error::$SITE_URL did not return 200"
          docker compose logs --tail 30 cloudflared
          exit 1
